services:
  api:
    image: ghcr.io/marcoscassone02/devops-task-api:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null
    restart: unless-stopped

  db:
    restart: unless-stopped
    volumes:
      - type: bind
        source: /data/postgres
        target: /var/lib/postgresql/data
    
  migrate:
    image: ghcr.io/marcoscassone02/devops-task-api:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null