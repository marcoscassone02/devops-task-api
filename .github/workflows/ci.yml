name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test --tag devops-task-api:test .

      - name: Run linter
        run: docker run --rm devops-task-api:test ruff check .
        
      - name: Audit Python dependencies
        run: >
          docker run
          --rm
          devops-task-api:test
          pip-audit
          --requirement requirements.txt

      - name: Run test suite
        run: >
          docker run
          --rm
          --env DATABASE_URL=sqlite+pysqlite:///:memory:
          devops-task-api:test

      - name: Build runtime image
        run: >
          docker build
          --target runtime
          --tag devops-task-api:runtime
          .

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 
        with:
          image-ref: devops-task-api:runtime
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0