name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test --tag devops-task-api:test .

      - name: Run linter
        run: docker run --rm devops-task-api:test ruff check .
        
      - name: Audit Python dependencies
        run: >
          docker run
          --rm
          devops-task-api:test
          pip-audit
          --requirement requirements.txt

      - name: Run test suite
        run: >
          docker run
          --rm
          --env DATABASE_URL=sqlite+pysqlite:///:memory:
          devops-task-api:test