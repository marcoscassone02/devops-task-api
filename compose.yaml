services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  test:
    build:
      context: .
      target: test
    profiles:
      - test
